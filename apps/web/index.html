<!doctype html>
<html lang="en" class="bg-bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0f0a18" />
    <title>Chog Sack Rumble</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap"
    />
  </head>
  <body class="m-0 h-dvh overflow-hidden bg-bg font-body text-fg [color-scheme:dark]">
    <main class="relative h-dvh w-full overflow-hidden select-none">
      <div
        id="stage"
        tabindex="-1"
        aria-label="3D view inside the giant Chog's sack"
        class="absolute inset-0 bg-stage [&>canvas]:block [&>canvas]:size-full focus:outline-none"
      ></div>
      <div id="ui" class="pointer-events-none absolute inset-0"></div>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
